name: Model Deployment

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "MLflow model version to deploy (leave blank for latest Production)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate AWS credentials
        run: aws sts get-caller-identity --output json
      - name: Deploy model via SSM and wait for readiness
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=mlops-training-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          test -n "$instance_id" && test "$instance_id" != "None"

          command_id=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$instance_id" \
            --parameters 'commands=[
              "cd /home/ec2-user/mlops-pipeline",
              "git pull origin main",
              "pkill -f uvicorn || true",
              "sleep 2",
              "nohup python3.11 -m uvicorn src.serving.api:app --host 0.0.0.0 --port 8000 --workers 2 > /var/log/fraud-api.log 2>&1 &",
              "for i in {1..30}; do curl -fsS http://localhost:8000/health && exit 0; sleep 5; done",
              "cat /var/log/fraud-api.log || true",
              "exit 1"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          for i in {1..48}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region ${{ env.AWS_REGION }} \
              --query "Status" \
              --output text)
            if [ "$status" = "Success" ]; then
              break
            fi
            if [ "$status" = "Failed" ] || [ "$status" = "Cancelled" ] || [ "$status" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --region ${{ env.AWS_REGION }}
              exit 1
            fi
            sleep 5
          done
          test "$status" = "Success"
      - name: Health check
        run: |
          curl --fail --show-error --retry 12 --retry-all-errors \
            --connect-timeout 5 --max-time 15 \
            http://${{ secrets.SERVING_HOST }}:8000/health
      - name: Notify
        run: |
          aws sns publish \
            --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
            --subject "✅ Manual Deployment Complete" \
            --message "Fraud detection model manually deployed. Version: ${{ github.event.inputs.model_version || 'latest Production' }}" \
            --region ${{ env.AWS_REGION }}
